name: Manual sol artifacts
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "The suite to deploy. The bare key is the rolling candidate (current source); a `@<tag>` key is a frozen release, which is what a newly supported network needs so the addresses every consumer pins land there."
        required: true
        type: choice
        options:
          - clone-factory
          - cyclo-receipt
          - cyclo-vault
          - sceptre-staked-flr-oracle
          - ftso-lts-feed-oracle-flr-usd
          - ftso-lts-feed-oracle-eth-usd
          - ftso-lts-feed-oracle-xrp-usd
          - ftso-lts-feed-oracle-joule-usd
          - pyth-oracle-weth-usd
          - pyth-oracle-wsteth-usd
          - pyth-oracle-wbtc-usd
          - pyth-oracle-cbbtc-usd
          - pyth-oracle-link-usd
          - pyth-oracle-dot-usd
          - pyth-oracle-uni-usd
          - pyth-oracle-pepe-usd
          - pyth-oracle-pyth-usd
          - pyth-oracle-ena-usd
          - pyth-oracle-arb-usd
          - pyth-oracle-xaut-usd
jobs:
  deploy:
    uses: rainlanguage/rainix/.github/workflows/rainix-manual-sol-artifacts.yaml@main
    with:
      suite: ${{ inputs.suite }}
    secrets: inherit

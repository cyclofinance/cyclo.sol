version = 1

[[annotations]]
path = [
  ".gas-snapshot",
  ".github/workflows/**/",
  ".gitignore",
  ".idea/**/",
  ".soldeerignore",
  "CLAUDE.md",
  "README.md",
  "erc1155Metadata/**/",
  "flake.lock",
  "flake.nix",
  "foundry.toml",
  "slither.config.json",
  "soldeer.lock",
  "REUSE.toml",
  "audit/**/",
  "foundry.lock",
]
SPDX-FileCopyrightText = "Copyright (c) 2020 Rain Open Source Software Ltd"
SPDX-License-Identifier = "LicenseRef-DCL-1.0"

# Vendored legacy sources: the exact files the on-chain bytecode was compiled
# from, kept at their submodule paths so the build and its remappings are
# unchanged. Deleted by the rain-vats 0.2.x upgrade (#54).
[[annotations]]
path = [
  "lib/ethgild/src/**",
  "lib/ethgild/test/**",
  "lib/ethgild/lib/rain.factory/src/**",
  "lib/ethgild/lib/rain.flare/src/**",
  "lib/ethgild/lib/rain.math.fixedpoint/src/**",
  "lib/ethgild/lib/rain.pyth/src/**",
  "lib/ethgild/lib/rain.pyth/lib/rain.interpreter/lib/rain.interpreter.interface/lib/rain.intorastring/src/**",
  "lib/ethgild/lib/rain.pyth/lib/rain.interpreter/lib/rain.interpreter.interface/lib/rain.math.float/src/**",
  "lib/rain.extrospection/src/**",
  "lib/rain.extrospection/lib/rain.solmem/src/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2020 Rain Open Source Software Ltd"
SPDX-License-Identifier = "LicenseRef-DCL-1.0"

[[annotations]]
path = [
  "lib/ethgild/lib/openzeppelin-contracts-upgradeable/**",
  "lib/ethgild/lib/rain.factory/lib/openzeppelin-contracts/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2016-2024 zOS Global Limited and contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["lib/ethgild/lib/solady/**"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2022 Solady"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "lib/ethgild/lib/rain.flare/lib/flare-smart-contracts/**",
  "lib/ethgild/lib/rain.flare/lib/flare-smart-contracts-v2/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) Flare Networks"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "lib/ethgild/lib/rain.flare/lib/rain.interpreter/lib/rain.interpreter.interface/lib/forge-std/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) Foundry contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["lib/ethgild/lib/rain.pyth/lib/pyth-crosschain/**"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) Pyth Data Association"
SPDX-License-Identifier = "Apache-2.0"
